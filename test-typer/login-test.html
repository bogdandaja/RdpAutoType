<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Test - RdpAutoType</title>
<style>
  :root {
    --bg: #0f1220;
    --card: #191d2e;
    --fg: #e8ebf5;
    --muted: #9aa3b8;
    --accent: #5c7cfa;
    --field: #0c0f1a;
    --border: #2a3042;
    --ok: #2fbf71;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font-family: Segoe UI, system-ui, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 26px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 11px 12px;
    background: var(--field); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 20px; padding: 11px;
    background: var(--accent); color: white;
    border: none; border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .result {
    margin-top: 18px; padding: 12px;
    background: var(--field); border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px; display: none;
    white-space: pre-wrap; word-break: break-all;
  }
  .result.show { display: block; }
  .result b { color: var(--ok); }
  .hint { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  kbd {
    background: #2a3042; padding: 1px 6px; border-radius: 4px;
    font-size: 11px; border: 1px solid #3a4258;
  }
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="off">
    <h1>Login Test</h1>
    <p class="sub">Tinta pentru RdpAutoType</p>

    <label for="user">Utilizator</label>
    <input type="text" id="user" name="user" autocomplete="off" autofocus>

    <label for="pass">Parola</label>
    <input type="password" id="pass" name="pass" autocomplete="off">

    <button type="submit">Autentificare</button>

    <div class="result" id="result"></div>

    <p class="hint">
      Da focus pe campul <b>Utilizator</b>, apoi declanseaza autotype.
      Secventa asteptata: user &rarr; <kbd>Tab</kbd> &rarr; parola &rarr; <kbd>Enter</kbd> (submit).
    </p>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const result = document.getElementById('result');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const u = document.getElementById('user').value;
      const p = document.getElementById('pass').value;
      result.innerHTML =
        '<b>Submit primit (Enter a mers)</b>\n' +
        'Utilizator: ' + (u || '(gol)') + '\n' +
        'Parola: ' + (p ? '*'.repeat(p.length) + '  (' + p.length + ' caractere)' : '(gol)');
      result.classList.add('show');
    });
  </script>
</body>
</html>
